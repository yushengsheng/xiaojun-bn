name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest-windows:
    runs-on: windows-latest

    env:
      XRAY_TAG: v26.3.27
      XRAY_ASSET: Xray-windows-64.zip
      XRAY_SHA256: d004c39288ce9ada487c6f398c7c545f7d749e44bdfdd59dbc9f865afba4e1ad
      SING_BOX_TAG: v1.13.5
      SING_BOX_ASSET: sing-box-1.13.5-windows-amd64.zip
      SING_BOX_SHA256: 841a46ab1fef823fefd4248229db5220f09535c883b4cfc6d4fbe5903bc3f1d1

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check tracked sensitive artifacts
        shell: pwsh
        run: python tools/check_sensitive_artifacts.py --root . --git-only

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          pip install --require-hashes -r requirements-build.lock

      - name: Download proxy runtimes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $proxyRoot = Join-Path $PWD "build-proxy"
          $xrayDir = Join-Path $proxyRoot "xray"
          $singBoxDir = Join-Path $proxyRoot "sing-box"
          New-Item -ItemType Directory -Path $xrayDir -Force | Out-Null
          New-Item -ItemType Directory -Path $singBoxDir -Force | Out-Null

          gh release download "${{ env.XRAY_TAG }}" --repo XTLS/Xray-core --pattern "${{ env.XRAY_ASSET }}" --dir $proxyRoot
          if ((Get-FileHash (Join-Path $proxyRoot "${{ env.XRAY_ASSET }}") -Algorithm SHA256).Hash.ToLower() -ne "${{ env.XRAY_SHA256 }}".ToLower()) { throw "xray asset digest mismatch." }
          Expand-Archive -Path (Join-Path $proxyRoot "${{ env.XRAY_ASSET }}") -DestinationPath $xrayDir -Force
          Remove-Item (Join-Path $proxyRoot "${{ env.XRAY_ASSET }}") -Force

          gh release download "${{ env.SING_BOX_TAG }}" --repo SagerNet/sing-box --pattern "${{ env.SING_BOX_ASSET }}" --dir $proxyRoot
          if ((Get-FileHash (Join-Path $proxyRoot "${{ env.SING_BOX_ASSET }}") -Algorithm SHA256).Hash.ToLower() -ne "${{ env.SING_BOX_SHA256 }}".ToLower()) { throw "sing-box asset digest mismatch." }
          Expand-Archive -Path (Join-Path $proxyRoot "${{ env.SING_BOX_ASSET }}") -DestinationPath $singBoxDir -Force
          Remove-Item (Join-Path $proxyRoot "${{ env.SING_BOX_ASSET }}") -Force

          if (-not (Get-ChildItem $xrayDir -Filter "xray.exe" -File -Recurse | Select-Object -First 1)) {
            throw "xray.exe was not found after extraction."
          }
          if (-not (Get-ChildItem $singBoxDir -Filter "sing-box.exe" -File -Recurse | Select-Object -First 1)) {
            throw "sing-box.exe was not found after extraction."
          }

      - name: Run regression checks and locked dependency audit
        shell: pwsh
        run: |
          $xrayExe = Get-ChildItem "build-proxy/xray" -Filter "xray.exe" -File -Recurse | Select-Object -First 1
          if (-not $xrayExe) {
            throw "xray.exe was not found before regression."
          }
          $singBoxExe = Get-ChildItem "build-proxy/sing-box" -Filter "sing-box.exe" -File -Recurse | Select-Object -First 1
          if (-not $singBoxExe) {
            throw "sing-box.exe was not found before regression."
          }
          $env:XRAY_PATH = $xrayExe.FullName
          $env:SING_BOX_PATH = $singBoxExe.FullName
          python tools\run_regression.py --gui --strict-pip-check

  source-check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - run: pip install --require-hashes -r requirements-build.lock
      - run: python tools/run_regression.py --skip-app-selftest --strict-pip-check
