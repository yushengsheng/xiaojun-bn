server {
    listen PANEL_PORT ssl;
    listen [::]:PANEL_PORT ssl;
    server_name SERVER_HOST;
    ssl_certificate TLS_CERT;
    ssl_certificate_key TLS_KEY;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:xiaojun_tls:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=604800" always;
    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_conn xiaojun_connections 16;
    location = /api/login {
        limit_req zone=xiaojun_login burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:BACKEND_PORT;
        include /etc/xiaojun-exchange/proxy-headers.conf;
    }
    location / {
        limit_req zone=xiaojun_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:BACKEND_PORT;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 45s;
        include /etc/xiaojun-exchange/proxy-headers.conf;
    }
}
