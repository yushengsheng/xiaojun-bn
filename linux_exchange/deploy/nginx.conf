user www-data;
worker_processes 1;
pid /run/xiaojun-exchange-nginx/nginx.pid;
error_log /var/log/nginx/xiaojun-exchange-error.log warn;
events { worker_connections 1024; }
http {
include /etc/nginx/mime.types;
default_type application/octet-stream;
server_tokens off;
access_log off;
client_body_temp_path /run/xiaojun-exchange-nginx/client-body;
proxy_temp_path /run/xiaojun-exchange-nginx/proxy;
fastcgi_temp_path /run/xiaojun-exchange-nginx/fastcgi;
uwsgi_temp_path /run/xiaojun-exchange-nginx/uwsgi;
scgi_temp_path /run/xiaojun-exchange-nginx/scgi;
limit_req_zone $binary_remote_addr zone=xiaojun_login:1m rate=3r/m;
limit_req_zone $binary_remote_addr zone=xiaojun_api:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=xiaojun_connections:1m;

CHALLENGE_SERVER
PANEL_SERVER
}
